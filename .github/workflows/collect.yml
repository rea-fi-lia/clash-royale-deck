name: collect decks

# CR Deck Builders のデータ収集（GitHub Actions 上の Node collector＝tools/collect.js）。
# 方針：今後の収集・重い分析JSON生成はGASへ戻さず、Actions上のNode builderで行う。
# 必要なもの：リポジトリ Secrets に CR_TOKEN（RoyaleAPI トークン）。GITHUB_TOKEN は自動。

on:
  workflow_dispatch:        # 手動実行（検証はこれで回す）
    inputs:
      target_branch:
        description: '書き込み先ブランチ（本番=data。検証は data-test）'
        required: false
        default: 'data'
      top_players:
        description: '集計するトップランカー数'
        required: false
        default: '1000'
      dispatch_source:
        description: '内部起動元（worker-cron等）'
        required: false
        default: ''
  schedule:
    # 本命の毎時 :15 起動は Cloudflare Worker Cron から workflow_dispatch する。
    # GitHub Actions のscheduleは遅延/欠落があり得るため、ここでは保険の「起動チェック」だけを置く。
    # 下の freshness gate が collect-freshness.json の鮮度を見て、古い時だけcollectorを実行する。
    # Worker Cron や15分台が欠落した時だけ37/57分がバックアップになる。
    - cron: '37 * * * *'
    - cron: '57 * * * *'

concurrency:
  group: collect-decks      # 多重起動を防ぐ（前の収集が走っていたら待つ）
  cancel-in-progress: false

permissions:
  contents: write           # data-test / data ブランチへ commit するため

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (main = collect.js を取得)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check data freshness
        id: freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE: ${{ github.event.inputs.dispatch_source || '' }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const out = process.env.GITHUB_OUTPUT;
          const eventName = process.env.EVENT_NAME || '';
          const dispatchSource = process.env.DISPATCH_SOURCE || '';
          function setOutput(key, value) {
            fs.appendFileSync(out, `${key}=${value}\n`);
          }
          if (eventName !== 'schedule' && dispatchSource !== 'worker-cron') {
            console.log(`manual/event=${eventName}; source=${dispatchSource || 'manual'}; run collector`);
            setOutput('run_collect', 'true');
            process.exit(0);
          }
          const repo = process.env.REPO;
          const token = process.env.GH_TOKEN;
          const headers = {
            'Accept': 'application/vnd.github+json',
            'User-Agent': 'cr-deck-freshness-gate',
            'Authorization': `Bearer ${token}`
          };
          async function readDataJson(path) {
            const url = `https://api.github.com/repos/${repo}/contents/${encodeURIComponent(path)}?ref=data`;
            const res = await fetch(url, { headers });
            if (!res.ok) throw new Error(`GitHub contents ${path} ${res.status}`);
            const body = await res.json();
            return JSON.parse(Buffer.from(body.content || '', 'base64').toString('utf8'));
          }
          (async () => {
            let run = true;
            let updated = '';
            let ageMin = null;
            try {
              let json;
              try { json = await readDataJson('collect-freshness.json'); }
              catch (markerErr) {
                console.log(`freshness marker missing; fallback to decks.json: ${markerErr.message}`);
                json = await readDataJson('decks.json');
              }
              updated = json.updated || '';
              const ts = Date.parse(updated);
              if (Number.isFinite(ts)) {
                ageMin = (Date.now() - ts) / 60000;
                run = ageMin >= 50;
              }
            } catch (err) {
              console.log(`freshness check failed; run collector as fallback: ${err.message}`);
              run = true;
            }
            console.log(`decks.updated=${updated || 'unknown'} ageMin=${ageMin == null ? 'unknown' : ageMin.toFixed(1)} run_collect=${run}`);
            setOutput('run_collect', run ? 'true' : 'false');
          })().catch(err => {
            console.log(`freshness check crashed; run collector as fallback: ${err.message}`);
            setOutput('run_collect', 'true');
          });
          NODE

      - name: Run collector
        if: steps.freshness.outputs.run_collect == 'true'
        env:
          # ★2026-08-11：帯別イベントの絞り込みでヒープが尽きてOOM(exit 134)になったため拡張。
          #   GitHubランナーは16GBあるので8GBまで使ってよい。
          NODE_OPTIONS: --max-old-space-size=8192
          CR_TOKEN: ${{ secrets.CR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'crdb-data-private' }}
          R2_PRIVATE_PREFIX: ${{ vars.R2_PRIVATE_PREFIX || 'private/' }}
          # R2/Worker/APIへ切替済み。dataブランチには collect-freshness.json だけ残し、分析JSONはR2へ閉じる。
          # 緊急時だけRepository Variablesで PRIVATE_GH_MIRROR/PUBLIC_GH_MIRROR を 1 に戻す。
          PRIVATE_GH_MIRROR: ${{ vars.PRIVATE_GH_MIRROR || '0' }}
          PUBLIC_GH_MIRROR: ${{ vars.PUBLIC_GH_MIRROR || '0' }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'data' }}
          TOP_PLAYERS: ${{ github.event.inputs.top_players || '1000' }}
          INTERVAL_HOURS: '1'
          WIN_MIN_GAMES_3D: '100'   # ★本番GASのスクリプトプロパティと一致（既定30を上書き運用中）。カットオーバー無風化。
          DECKS_PATH: 'decks.json'   # GITHUB_PATH は Actions 予約名のため使わない
        run: node tools/collect.js
