name: collect decks

# CR Deck Builders のデータ収集（GAS の updateDecks を Node 移植＝tools/collect.js）。
# Phase 1（検証中）：書き込み先は data-test ブランチ。GAS出力(data)と照合してから data へ切替える。
# 必要なもの：リポジトリ Secrets に CR_TOKEN（RoyaleAPI トークン）。GITHUB_TOKEN は自動。

on:
  workflow_dispatch:        # 手動実行（検証はこれで回す）
    inputs:
      target_branch:
        description: '書き込み先ブランチ（本番=data。検証は data-test）'
        required: false
        default: 'data'
      top_players:
        description: '集計するトップランカー数'
        required: false
        default: '1000'
  schedule:
    - cron: '0 * * * *'   # 1時間ごと（Phase 2＝超新鮮メタ）。uniq/games は頻度非依存・count(延べ)のみ膨らむが表示はuniq/games主。

concurrency:
  group: collect-decks      # 多重起動を防ぐ（前の収集が走っていたら待つ）
  cancel-in-progress: false

permissions:
  contents: write           # data-test / data ブランチへ commit するため

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (main = collect.js を取得)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run collector
        env:
          CR_TOKEN: ${{ secrets.CR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'data' }}
          TOP_PLAYERS: ${{ github.event.inputs.top_players || '1000' }}
          INTERVAL_HOURS: '6'
          WIN_MIN_GAMES_3D: '100'   # ★本番GASのスクリプトプロパティと一致（既定30を上書き運用中）。カットオーバー無風化。
          DECKS_PATH: 'decks.json'   # GITHUB_PATH は Actions 予約名のため使わない
        run: node tools/collect.js
