name: build card stats

# カードの実数値(card-stats.json)をコミュニティWikiから取り直してR2へ公開する。
# 背景: 生成コードが存在せず6/11で凍結していたため、バランス調整に追従できていなかった。
# 台帳・画像内容・詳細値・全ページを同じ処理で更新。Wiki未反映は鮮度として保持。

on:
  schedule:
    - cron: '40 4 * * *' # 毎日 13:40 JST（収集の毎時:15/:37/:57とずらす）
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true にすると差分を表示するだけでR2へ公開しない'
        required: false
        default: 'false'

permissions:
  contents: write   # 生成したカードページをコミットするため

concurrency:
  group: build-card-stats

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # sitemap の lastmod を「そのファイルが実際に変わった日」にするため、
          # git log でファイル単位の履歴を引けるように全履歴を取る。
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh official catalogue and verify artwork
        env:
          CR_TOKEN: ${{ secrets.CR_TOKEN }}
        run: |
          node tools/update-card-catalogue.js --refresh --report "$RUNNER_TEMP/catalogue-report.json"
          node tools/update-card-catalogue.js --check
          node --test tools/test-card-catalogue.mjs

      - name: Save public catalogue review (no battle or private stats data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-catalogue-review
          path: |
            catalogue/cards.json
            catalogue/manifest.json
            ${{ runner.temp }}/catalogue-report.json
          retention-days: 7

      - name: Stage card stats from current R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'crdb-data-private' }}
          R2_PRIVATE_PREFIX: ${{ vars.R2_PRIVATE_PREFIX || 'private/' }}
        run: node tools/build-card-stats.js --from-r2 --out "$RUNNER_TEMP/card-stats.json"

      # カード個別ページ（/cards/*.html）を最新の実数値・タグ・実戦データで焼き直す。
      # ★2026-08-11追加。AdSense「有用性の低いコンテンツ」対策で作った122枚の静的ページ。
      #   数値が古いと「役に立たないページ」に戻るので、実数値の更新と同じ便で回す。
      - name: Rebuild card pages
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'crdb-data-private' }}
          R2_PRIVATE_PREFIX: ${{ vars.R2_PRIVATE_PREFIX || 'private/' }}
        run: |
          node tools/build-card-pages.js --from-r2 --stats "$RUNNER_TEMP/card-stats.json" --from-api
          node tools/gen-i18n.js
          node tools/check-card-images.js --lint-only
          node tools/check-private-leak.js

      - name: Commit card pages
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue js/cards-data.js cards sitemap.xml
          git add -u -- '*.html'
          if git diff --cached --quiet; then
            echo "カードページに差分なし"
          else
            git commit -m "chore(cards): 共通台帳・画像版・詳細ページを更新"
            git push
          fi

      - name: Publish verified stats snapshot
        if: github.event.inputs.dry_run != 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'crdb-data-private' }}
          R2_PRIVATE_PREFIX: ${{ vars.R2_PRIVATE_PREFIX || 'private/' }}
        run: node tools/build-card-stats.js --publish-file "$RUNNER_TEMP/card-stats.json"

      # 監修シートの実数値列（HP16/DPS16等）も同じ値へ揃える。
      # ★2026-08-11まで手入力のままで、158行中153行が古い値だった。
      #   人がタグを見直す土台がズレていては監修が成立しないので自動追従させる。
      - name: Prepare Google credentials
        if: github.event.inputs.dry_run != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON secret is missing" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-service-account.json"

      - name: Sync stats into supervision sheet
        if: github.event.inputs.dry_run != 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/google-service-account.json
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'crdb-data-private' }}
          R2_PRIVATE_PREFIX: ${{ vars.R2_PRIVATE_PREFIX || 'private/' }}
        run: node tools/sync-sheet-stats.js --from-r2

      - name: Report stale or missing detail sources
        run: |
          node -e 'const s=require(process.env.RUNNER_TEMP+"/card-stats.json");if(s.refresh.failed)throw Error(s.refresh.failed+" card detail sources need review; last good values retained")'

      # ★通知は .github/actions/notify に一本化してある。
      #   鳴らし方を変えたいときはあのファイル1枚を直せば全ワークフローに効く。
      - name: 結果を通知
        if: always() && github.event.inputs.dry_run != 'true'
        uses: ./.github/actions/notify
        with:
          status: ${{ job.status }}
          workflow: build-card-stats.yml
          label: カード実数値の取得
          streak: '1'
          detail: Wikiからの再取得が止まると、圏内判定などの導出タグが古いままになります。
          github_token: ${{ secrets.GITHUB_TOKEN }}
          discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          line_push_token: ${{ secrets.LINE_PUSH_TOKEN }}
          line_push_to: ${{ secrets.LINE_PUSH_TO }}
