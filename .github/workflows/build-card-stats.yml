name: build card stats

# カードの実数値(card-stats.json)を公式Wikiから取り直してR2へ公開する。
# 背景: 生成コードが存在せず6/11で凍結していたため、バランス調整に追従できていなかった。
# 毎日1回まわしておけば、調整の翌日には自動で最新化される。

on:
  schedule:
    - cron: '40 4 * * *' # 毎日 13:40 JST（収集の毎時:15/:37/:57とずらす）
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true にすると差分を表示するだけでR2へ公開しない'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: build-card-stats

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build card stats from wiki
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'crdb-data-private' }}
          R2_PRIVATE_PREFIX: ${{ vars.R2_PRIVATE_PREFIX || 'private/' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node tools/build-card-stats.js --from-r2
          else
            node tools/build-card-stats.js --from-r2 --publish
          fi

      # 監修シートの実数値列（HP16/DPS16等）も同じ値へ揃える。
      # ★2026-08-11まで手入力のままで、158行中153行が古い値だった。
      #   人がタグを見直す土台がズレていては監修が成立しないので自動追従させる。
      - name: Prepare Google credentials
        if: github.event.inputs.dry_run != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON secret is missing" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-service-account.json"

      - name: Sync stats into supervision sheet
        if: github.event.inputs.dry_run != 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/google-service-account.json
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'crdb-data-private' }}
          R2_PRIVATE_PREFIX: ${{ vars.R2_PRIVATE_PREFIX || 'private/' }}
        run: node tools/sync-sheet-stats.js --from-r2
