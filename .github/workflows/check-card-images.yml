name: check card images

# ★2026-08-11に確立したルールの番人。
#   画像の解決を js/cards-data.js の cardImageSrc/cardImgTag に一本化したので、
#   そこを迂回する <img> が入ったら落とす。
#   併せて公式APIとの形態の突合と、全URLの実在も見る。
on:
  push:
    paths:
      - 'js/**'
      - 'tools/check-card-images.js'
      - '.github/workflows/check-card-images.yml'
  workflow_dispatch:
  schedule:
    - cron: '10 5 * * *'   # 毎日1回、新実装の取りこぼしを拾う

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          CR_TOKEN: ${{ secrets.CR_TOKEN }}
        run: node tools/check-card-images.js

      # ★通知は .github/actions/notify に一本化してある。
      #   鳴らし方を変えたいときはあのファイル1枚を直せば全ワークフローに効く。
      - name: 結果を通知
        if: always()
        uses: ./.github/actions/notify
        with:
          status: ${{ job.status }}
          workflow: check-card-images.yml
          label: カード画像の点検
          streak: '1'
          detail: 画像が表示できない状態になっている可能性があります。
          github_token: ${{ secrets.GITHUB_TOKEN }}
          discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          line_push_token: ${{ secrets.LINE_PUSH_TOKEN }}
          line_push_to: ${{ secrets.LINE_PUSH_TO }}
