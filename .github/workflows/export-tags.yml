name: export tags sheet

# 監修シート「タグ」タブ → card-tags.json → R2。
# ★2026-08-11まで、この経路が存在しなかった（ポテンシャルにはあった）。
#   シートでタグを直しても本番に一切反映されない状態だったので新設する。
on:
  workflow_dispatch:
  schedule:
    - cron: '50 4 * * *'   # card-stats(04:40 UTC)の後に回す

permissions:
  contents: read

concurrency:
  group: export-tags
  cancel-in-progress: false

jobs:
  export-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON secret is missing" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-service-account.json"

      - name: Export tags to R2
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/google-service-account.json
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'crdb-data-private' }}
          R2_PRIVATE_PREFIX: ${{ vars.R2_PRIVATE_PREFIX || 'private/' }}
          PUBLIC_GH_MIRROR: '0'
        run: node tools/export-tags-from-sheet.js --out "$RUNNER_TEMP/card-tags.json" --publish --verify

      # ★通知は .github/actions/notify に一本化してある。
      #   鳴らし方を変えたいときはあのファイル1枚を直せば全ワークフローに効く。
      - name: 結果を通知
        if: always()
        uses: ./.github/actions/notify
        with:
          status: ${{ job.status }}
          workflow: export-tags.yml
          label: タグのシート同期
          streak: '1'
          detail: スプレッドシートへの同期が止まっています。
          github_token: ${{ secrets.GITHUB_TOKEN }}
          discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          line_push_token: ${{ secrets.LINE_PUSH_TOKEN }}
          line_push_to: ${{ secrets.LINE_PUSH_TO }}
