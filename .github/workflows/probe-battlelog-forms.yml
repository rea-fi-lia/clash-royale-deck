name: probe battlelog forms
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          CR_TOKEN: ${{ secrets.CR_TOKEN }}
        run: node tools/probe-battlelog-forms.js
