name: probe card icons
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          CR_TOKEN: ${{ secrets.CR_TOKEN }}
        run: node tools/probe-card-icons.js
